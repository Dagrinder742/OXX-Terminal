<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXX Terminal | Trinity Live Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131722;
            --border-color: #2a2e39;
            --text-primary: #d1d4dc;
            --accent-gold: #f0b90b;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-gold); letter-spacing: 1px; }
        .status-badge {
            background: rgba(14, 203, 129, 0.1);
            color: var(--accent-green);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            border: 1px solid rgba(14, 203, 129, 0.3);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
        }
        .card h3 { margin-top: 0; color: #848e9c; font-size: 0.9rem; text-transform: uppercase; }
        .metric-value { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        th { background-color: #1e222d; color: #848e9c; }
        tr:hover { background-color: #1a1e29; }
    </style>
</head>
<body>

    <header>
        <h1>OXX TERMINAL // TRINITY TELEMETRY</h1>
        <div class="status-badge" id="connection-status">● LIVE STREAM ACTIVE</div>
    </header>

    <div class="grid">
        <div class="card">
            <h3>Active Asset</h3>
            <div class="metric-value" id="card-asset">BTC-USDT</div>
        </div>
        <div class="card">
            <h3>Latest Market State</h3>
            <div class="metric-value" id="card-state" style="color: var(--accent-red);">Connecting...</div>
        </div>
        <div class="card">
            <h3>Support / Resistance</h3>
            <div class="metric-value" id="card-levels" style="font-size: 1.2rem; margin-top: 15px;">-</div>
        </div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
        <div style="padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-weight: bold;">Historical Pulse Ledger</div>
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Instrument</th>
                    <th>Market State</th>
                    <th>Support</th>
                    <th>Resistance</th>
                </tr>
            </thead>
            <tbody id="history-rows">
                <!-- Injected via JS -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchTelemetry() {
            try {
                const response = await fetch('http://localhost:8080/api/status');
                const data = await response.json();
                
                if (data.history && data.history.length > 0) {
                    // Get latest entry
                    const latest = data.history[data.history.length - 1];
                    
                    document.getElementById('card-asset').innerText = latest.instrument;
                    document.getElementById('card-state').innerText = latest.market_state;
                    document.getElementById('card-levels').innerText = `S: $${latest.support} | R: $${latest.resistance}`;
                    
                    // Populate table (reverse chronological)
                    const tbody = document.getElementById('history-rows');
                    tbody.innerHTML = '';
                    
                    [...data.history].reverse().forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${new Date(row.timestamp).toLocaleTimeString()}</td>
                            <td>${row.instrument}</td>
                            <td>${row.market_state}</td>
                            <td>$${row.support}</td>
                            <td>$${row.resistance}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error("Failed to fetch telemetry:", err);
                document.getElementById('connection-status').style.color = 'var(--accent-red)';
                document.getElementById('connection-status').style.borderColor = 'rgba(246, 70, 93, 0.3)';
                document.getElementById('connection-status').style.background = 'rgba(246, 70, 93, 0.1)';
                document.getElementById('connection-status').innerText = '● CONNECTION LOST';
            }
        }

        // Poll every 5 seconds
        fetchTelemetry();
        setInterval(fetchTelemetry, 5000);
    </script>
</body>
</html>
